counterforce:
  cooldown_seconds: 600

# Recognition and retention
recognition:
  # If true, missing/stale authority_scope or validity_horizon produces NON_RECOGNIZABLE.
  require_prerequisites: true
  # If true, NON_RECOGNIZABLE attempts are conservatively QUARANTINE'd at admission.
  quarantine_on_non_recognizable: true

retention:
  # Keep N days of low-volume recognition journal entries.
  journal_days: 7

fp_lite:
  version: fp-lite-v0
  thresholds:
    wan_rtt_ms: [80, 150, 250]
    wan_loss_pct: [1, 2, 5]
    retry_rate: [0.05, 0.15, 0.25]
    airtime_busy: [0.60, 0.75, 0.90]
    steer_count: [5, 12, 20]
    temp_c: [70, 85, 92]

boundaries:
  steering_oscillation:
    steer_count_gt: 12
  wan_tail:
    rtt_ms_gt: 150
    loss_pct_gt: 2
  thermal:
    temp_c_gt: 88
  readiness:
    min_domain_observations: 1
